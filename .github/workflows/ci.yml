name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/02-mcp-tool-selection/requirements.txt
      - name: Install MCP SDK
        run: python -m pip install -r projects/02-mcp-tool-selection/requirements.txt
      - name: Run workshop gate
        shell: pwsh
        run: ./go.ps1 -Check
