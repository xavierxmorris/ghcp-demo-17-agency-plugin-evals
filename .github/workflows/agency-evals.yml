name: Agency evals

on:
  workflow_dispatch:
    inputs:
      harness:
        description: Evaluation harness installed on the self-hosted runner
        required: true
        default: msbench
        type: choice
        options:
          - msbench
          - vally
      run_full:
        description: Execute model-scored suites after validation and generation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64, agency]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP SDK
        run: python -m pip install -r projects/02-mcp-tool-selection/requirements.txt
      - name: Deterministic gate
        shell: pwsh
        run: ./go.ps1 -Check
      - name: Materialize suites
        shell: pwsh
        run: |
          $projects = @(
            'projects\01-skill-routing',
            'projects\02-mcp-tool-selection',
            'projects\03-custom-agent-regression'
          )
          foreach ($project in $projects) {
            $name = Split-Path $project -Leaf
            agency eval-new doctor --plugin $project --strict
            agency eval-new generate --plugin $project --out "generated-evals\$name"
          }
      - name: Run model-scored suites
        if: ${{ inputs.run_full }}
        shell: pwsh
        run: |
          $projects = @(
            'projects\01-skill-routing',
            'projects\02-mcp-tool-selection',
            'projects\03-custom-agent-regression'
          )
          foreach ($project in $projects) {
            agency eval-new run `
              --plugin $project `
              --harness '${{ inputs.harness }}' `
              --workers 2 `
              --keep-tempdir
          }
      - uses: actions/upload-artifact@v4
        with:
          name: generated-evals
          path: generated-evals
