name: Agency evals

on:
  workflow_dispatch:
    inputs:
      harness:
        description: Evaluation harness installed on the self-hosted runner
        required: true
        default: msbench
        type: choice
        options:
          - msbench
          - vally
      run_full:
        description: Execute model-scored suites after validation and generation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: [self-hosted, Windows, X64, agency]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install MCP SDK
        run: python -m pip install -r projects/02-mcp-tool-selection/requirements.txt
      - name: Deterministic gate
        shell: pwsh
        run: ./go.ps1 -Check
      - name: Materialize suites
        shell: pwsh
        run: |
          $projects = @(
            'projects\01-skill-routing',
            'projects\02-mcp-tool-selection',
            'projects\03-custom-agent-regression'
          )
          foreach ($project in $projects) {
            $name = Split-Path $project -Leaf
            agency eval-new doctor --plugin $project --strict
            agency eval-new generate --plugin $project --out "generated-evals\$name"
          }
      - name: Run model-scored suites
        if: ${{ inputs.run_full }}
        shell: pwsh
        run: |
          $projects = @(
            'projects\01-skill-routing',
            'projects\02-mcp-tool-selection',
            'projects\03-custom-agent-regression'
          )
          foreach ($project in $projects) {
            agency eval-new run `
              --plugin $project `
              --harness '${{ inputs.harness }}' `
              --workers 2 `
              --keep-tempdir
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-evals
          path: generated-evals
